# ROM → IWRAM IRQ handler. Evidence (text08000000.s ~6152-6165):
#   ldr r0, =0x0800010C
#   ldr r4, =0x0300004C
#   movs r2, #0xC0; lsls r2, r2, #1   → CpuSet control = 0x180
#   bl CpuSet                          → 16-bit mode, 0x180 halfwords = 0x300 bytes
#   str r4, [0x03007FFC]               → standard IRQ vector points at 0x0300004C
# Source bytes live inside gf_afunc_080000F0; the same image is also executed
# from IWRAM after the copy. code_copy only maps decode source — the runtime
# entry still needs an [[extra_func]] (TOML_SCHEMA.md).
[[code_copy]]
runtime_start = 0x0300004C
source_start  = 0x0800010C
size          = 0x00000300
name          = "iwram_irq_blob"
note          = "CpuSet(0x0800010C → 0x0300004C, count=0x180). Measured as 16-bit CpuSet: 0x180 halfwords = 0x300 bytes. Do NOT expand without evidence — larger spans decode data as code and can hang."

[[extra_func]]
addr = 0x0300004C
mode = "arm"
name = "iwram_irq_main"
note = "Runtime IRQ vector (0x03007FFC); ROM source 0x0800010C via code_copy"

