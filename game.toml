# ---------------------------------------------------------------------------
# Function-boundary fix (call-return stack overflow).
#
# sub_819A204 = Thumb stub + `bx pc` + inline ARM body (`bx lr` at 0x0819A234)
# then DATA. A second Thumb body at 0x0819A3BA does `bl sub_819A204` and
# continues at 0x0819A3C4. A too-wide resume_range (0x0819A204..0x0819B204)
# merged callee and caller into ONE host, turning that `bl` into self-recursion
# → "generated call-return stack overflow at return_pc=0x0819A3C4".
#
# Keep callee and caller separate; only roll each body's interior labels.
# Workaround: keep the Thumb BL pair at 0x0819A3C0/3C2 out of static codegen.
# The emitter splits it into two 16-bit ops and call-return-stack-overflows
# ("overflow at return_pc=0x0819A3C4"). Runtime interpreter-bridges this body
# instead (interpreter handles BL pairs correctly).
# Note: resume_range may not contain exclude_func — so no resume_range here.
[[exclude_func]]
addr = 0x0819A3BA
reason = "Thumb BL pair 0x0819A3C0/3C2 mis-lowered as bl.hi+bl.lo; interpreter bridge until framework fix"

[[exclude_func]]
addr = 0x0819A3C0
reason = "BL halfword pair start; see 0x0819A3BA"

# Shared return stub (add sp,#0x40; pop; pop {r0}; bx r0). Reached by
# `bl` from 0x08125510 (range-check fail path of sub_81254FC) and by the
# switch table. Must be a static host so self-heal does not spin in it.
[[extra_func]]
addr = 0x08126504
mode = "thumb"
name = "shared_epilogue_08126504"
note = "shared tail-return stub; pop {r0}; bx r0 — returns to original stacked LR"

