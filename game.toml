# ---------------------------------------------------------------------------
# Mario & Luigi: Superstar Saga (GBA, USA "A88E") — gbarecomp game configuration.
#
# Serves both sides of the pipeline (docs/TOML_SCHEMA.md in gbarecomp-main):
#   * recompiler  (`gba_recompile --config game.toml`)
#   * runtime     (`--config game.toml`)
#
# Identity values are measured from the verified local ROM and recorded in
# docs/ROM_IDENTITY.json. HUMAN-REVIEWED ONLY: never auto-merge
# recomp_master_misses_*.toml.frag proposals into this file.
# ---------------------------------------------------------------------------

[game]
name = "Mario & Luigi: Superstar Saga"
short_name = "mlss"

[program]
name = "Mario & Luigi: Superstar Saga (USA)"
id = "A88E"
load_address = 0x08000000
size = 0x01000000          # 16 MiB (verified)
entry_pc = 0x08000000      # cartridge reset vector; ARM branch 0xEA00002E -> 0x080000C0
codegen_shards = 8
# static_resume_all was true: every aligned instruction becomes an IRQ-resumable
# dispatch entry. Combined with split Thumb BL pairs (0x0819A3C0/3C2) this
# ballooned the shadow call-return stack to the 1024 cap during demo input
# ("generated call-return stack overflow at return_pc=0x0819A3C4").
# Try false until the BL-pair / mixed ARM-Thumb stub at sub_819A204 is clean.
static_resume_all = false

[identity]
sha1 = "7c303cdde5061ee329296948060b875cb50ba410"
md5 = "4b1a5897d89d9e74ec7f630eefdfd435"

[rom]
path = "Mario Luigi - Superstar Saga (USA).gba"
sha1 = "7c303cdde5061ee329296948060b875cb50ba410"

[bios]
sha1 = "300c20df6731a33952ded8c436f7f186d25d3492"
hle = false
skip_intro = false

[save]
# Resolved from the first headless boot banner (logs/boot-smoke.log):
#   rom_loaded ... save=EEPROM signature=EEPROM_V
#   save_config source=game-config type=Flash 128KB (detected=EEPROM ...)
# The cartridge ROM signature is authoritative for the save engine
# Cartridge save type: EEPROM_V124 at 0x21DBA0. The decomp flash_internal.h
# (1 Mbit MX29L010 API) is real source material but is NOT what this
# cartridge image advertises. Size 8192 = 8 KB serial EEPROM (14-bit addr);
# confirm write/readback on the first in-game save.
type = "eeprom"
size = 8192
path = "saves/mlss_usa.sav"

[runtime]
window_title = "MarioLuigiSuperstarSagaRecomp"
debug_port = 19856

[video]
screen = "raw"
view_width = 240
resize_view = false

[audio]
shadow = false

